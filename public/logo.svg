<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Fundo sutil do documento -->
  <rect x="15" y="10" width="70" height="80" rx="10" fill="#0B1F33" fill-opacity="0.08" />
  
  <!-- Letra P / Corpo do Documento Principal -->
  <path d="M30 25V75" stroke="#0B1F33" stroke-width="8" stroke-linecap="round" />
  
  <!-- Curva do P que forma a automação circulada -->
  <path d="M30 25H55C63.2843 25 70 31.7157 70 40C70 48.2843 63.2843 55 55 55H30" stroke="#11B7A3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Linhas Internas representando o documento fiscal e movimento -->
  <line x1="40" y1="35" x2="55" y2="35" stroke="#0B1F33" stroke-width="4" stroke-linecap="round" />
  <line x1="40" y1="45" x2="52" y2="45" stroke="#0B1F33" stroke-width="4" stroke-linecap="round" />
  
  <!-- Pixels Digitais Decorativos -->
  <!-- Pixel em Cobre Dourado -->
  <rect x="74" y="20" width="10" height="10" rx="2.5" fill="#D5903B" />
  <!-- Pixel em Verde-Água -->
  <rect x="64" y="65" width="8" height="8" rx="2" fill="#11B7A3" />
  <!-- Pixel em Azul-Marinho -->
  <rect x="70" y="75" width="5" height="5" rx="1.2" fill="#0B1F33" />
</svg>
